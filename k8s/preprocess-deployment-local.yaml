apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocessing-service
  namespace: deeplog
  labels:
    app: preprocessing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preprocessing-service
  template:
    metadata:
      labels:
        app: preprocessing-service
    spec:
      containers:
        - name: preprocessing-service
          image: dev.local/preprocessing-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap.deeplog.svc:9092"
            - name: RAW_LOG_TOPIC
              value: "hdfs-raw-logs"
            - name: ALERT_TOPIC
              value: "anomaly-alerts"
            - name: KSERVE_ENDPOINT
              value: "http://deeplog-serving-predictor.deeplog.svc.cluster.local/v1/models/deeplog:predict"
            - name: WINDOW_SIZE
              value: "10"
            - name: TOP_G
              value: "9"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: preprocessing-service
  namespace: deeplog
  labels:
    app: preprocessing-service
spec:
  selector:
    app: preprocessing-service
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
