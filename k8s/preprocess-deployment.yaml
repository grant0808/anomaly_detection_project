apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocessing-service
  namespace: deeplog
  labels:
    app: preprocessing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: preprocessing-service
  template:
    metadata:
      labels:
        app: preprocessing-service
    spec:
      containers:
      - name: preprocessing-service
        image: asia-northeast3-docker.pkg.dev/pro-platform-495513-b9/deeplog-repo/preprocessing-service:2facbf701b677147e818a89a4296bfbd4672b9f1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-cluster-kafka-bootstrap.deeplog.svc:9092"
        - name: RAW_LOG_TOPIC
          value: "hdfs-raw-logs"
        - name: ALERT_TOPIC
          value: "anomaly-alerts"
        - name: KSERVE_ENDPOINT
          value: "http://deeplog-serving-predictor.deeplog.svc.cluster.local/v1/models/deeplog:predict"
        - name: WINDOW_SIZE
          value: "10"
        - name: TOP_G
          value: "9"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: preprocessing-service
  namespace: deeplog
spec:
  selector:
    app: preprocessing-service
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
