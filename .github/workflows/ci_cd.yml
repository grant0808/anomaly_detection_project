name: DeepLog MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: asia-northeast3 # GCP Seoul Region
  REPOSITORY: deeplog-repo # Name of the Google Artifact Registry repository
  LOG_GEN_IMAGE: log-generator
  PREPROCESS_IMAGE: preprocessing-service

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    # Add permissions for Workload Identity Federation if used
    permissions:
      contents: 'write'
      id-token: 'write'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud
    # For production, it's recommended to use Workload Identity Federation (WIF).
    # If using WIF, configure secrets.GCP_WIF_PROVIDER and secrets.GCP_WIF_SERVICE_ACCOUNT.
    # Otherwise, fallback to GCP Service Account Key JSON stored in secrets.GCP_SA_KEY.
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
        # credentials_json: ${{ secrets.GCP_SA_KEY }} # Uncomment if using SA Key

    # 2. Login to Google Artifact Registry (GAR)
    - name: Login to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    # 3. Build and Push Log Generator Image
    - name: Build and Push Log Generator
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.log_generator
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.LOG_GEN_IMAGE }}:latest
          ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.LOG_GEN_IMAGE }}:${{ github.sha }}

    # 4. Build and Push Preprocessing Service Image
    - name: Build and Push Preprocessing Service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.preprocess
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.PREPROCESS_IMAGE }}:latest
          ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.PREPROCESS_IMAGE }}:${{ github.sha }}

    # 5. GitOps Image Tag Update
    # This step updates the image tags in the K8s deployment manifests
    # and commits them back to trigger ArgoCD synchronization.
    - name: Update Kubernetes Manifests (GitOps)
      if: github.event_name != 'pull_request'
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Ensure k8s manifests folder exists
        mkdir -p k8s
        
        # Helper to update tags in deployment files if they exist
        # e.g., updates image field to match the newly built GAR tag
        if [ -f k8s/log-generator-deployment.yaml ]; then
          sed -i "s|image: .*$LOG_GEN_IMAGE:.*|image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.LOG_GEN_IMAGE }}:${{ github.sha }}|g" k8s/log-generator-deployment.yaml
        fi
        
        if [ -f k8s/preprocess-deployment.yaml ]; then
          sed -i "s|image: .*$PREPROCESS_IMAGE:.*|image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.PREPROCESS_IMAGE }}:${{ github.sha }}|g" k8s/preprocess-deployment.yaml
        fi
        
        # Check if there are changes to commit
        if ! git diff --quiet; then
          git add k8s/
          git commit -m "chore(gitops): update image tags to ${{ github.sha }} [skip ci]"
          git push
        else
          echo "No manifest changes detected."
        fi
