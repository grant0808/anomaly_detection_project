apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: hdfs-raw-logs
  namespace: deeplog
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: 86400000 # 24 hours retention
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: processed-windows
  namespace: deeplog
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: 86400000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: anomaly-alerts
  namespace: deeplog
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: 604800000 # 7 days retention for alerts history
